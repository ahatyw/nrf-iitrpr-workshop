
# --- Hardware Subsystems ---
CONFIG_I2C=y
CONFIG_SENSOR=y

# --- Serial and Console (For UI / UART) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y

# --- System Features ---
CONFIG_REBOOT=y

# --- CRITICAL FOR TEMPERATURE/HUMIDITY SENSORS ---
# Allows printf to handle decimal numbers (%.2f)
CONFIG_CBPRINTF_FP_SUPPORT=y